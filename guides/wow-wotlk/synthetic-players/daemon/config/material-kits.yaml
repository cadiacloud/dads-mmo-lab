version: 1
game_version: "Wrath of the Lich King 3.3.5a"
quantity_basis: "Guide shopping-list quantities plus the declared finishing route; alternatives are resolved locally without allowing the model to change counts. Yellow/green skill-up RNG can still require a refill."
sources:
  alchemy: "https://www.wow-professions.com/wotlk/alchemy-leveling-guide-wotlk-classic"
  inscription: "https://www.wow-professions.com/wotlk/inscription-leveling-guide-wotlk-classic"
  jewelcrafting: "https://www.wow-professions.com/wotlk/jewelcrafting-leveling-guide-wotlk-classic"
  engineering: "https://www.wow-professions.com/wotlk/engineering-leveling-guide-wotlk-classic"
  tailoring: "https://www.wow-professions.com/wotlk/tailoring-leveling-guide-wotlk-classic"

# Acquisition modes are deterministic capabilities, not LLM claims:
# herbalism/mining/skinning use the named learned skill; loot uses normal
# Playerbots mob looting; auction is tracked but never reported as gathered.
# Bars are represented as raw ore so the real player leveling the profession
# receives the smelting opportunity. Vendor reagents are intentionally omitted.
