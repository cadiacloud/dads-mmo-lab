[project]
name = "synthetic-players-daemon"
version = "0.1.0"
description = "Local-LLM persona and bounded-action bridge for AzerothCore WoW WotLK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.scripts]
synthetic-daemon = "synthetic_daemon.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_daemon*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
